CONFIG_USB_DEVICE_STACK_NEXT=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_CDC_ACM_CLASS=y

CONFIG_I2C=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

CONFIG_MICROPY_HEAP_SIZE=98304
CONFIG_MAIN_STACK_SIZE=8192
# LFS on our storage requires 8192 bytes per open file
# (8192 * 4 + 256) enables 4 files concurrently open
CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=33024

CONFIG_HARDWARE_DEVICE_CS_GENERATOR=y

CONFIG_MICROPY_FROZEN_MANIFEST="../../../manifest.py"
